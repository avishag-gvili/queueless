<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="font-family: Arial, sans-serif; direction: rtl; text-align: right; background: #f9f9f9; margin: 0; padding: 20px;">
  <div style="max-width: 520px; margin: 0 auto; background: white; border-radius: 8px; padding: 32px; border: 1px solid #e5e7eb;">
    <h2 style="color: #3b82f6; margin-top: 0;">📋 עדכון סטטוס תור</h2>
    <p>שלום,</p>
    <p>הסטטוס של התור שלך ב-<strong>{{business_name}}</strong> עודכן ל-<strong>{{new_status}}</strong>.</p>
    <table style="width: 100%; border-collapse: collapse; margin: 16px 0;">
      <tr>
        <td style="padding: 8px 0; color: #6b7280; width: 40%;">שירות:</td>
        <td style="padding: 8px 0; font-weight: bold;">{{service_name}}</td>
      </tr>
      <tr>
        <td style="padding: 8px 0; color: #6b7280;">תאריך ושעה:</td>
        <td style="padding: 8px 0; font-weight: bold;">{{appointment_datetime}}</td>
      </tr>
    </table>
    <p style="color: #6b7280; font-size: 14px;">לשאלות, פנה ישירות לעסק.</p>
  </div>
</body>
</html>
